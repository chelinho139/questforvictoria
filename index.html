<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quest For Victoria</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0c1018; --panel:#151c2a; --panel2:#1d2637; --line:#2c3852; --line2:#3a4966;
  --ink:#ebe5d4; --muted:#93a0b8; --dim:#5d6b85;
  --ember:#ff8c42; --ember-dk:#9c4a1c; --teal:#3ddbd9; --teal-dk:#186b6a;
  --gold:#f2c14e; --hp:#e0504b; --mp:#4a7fe0; --ok:#6ccf6a; --purple:#a78bfa;
  --fd:'Silkscreen','Courier New',monospace;
  --fb:'VT323','Courier New',monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:19px;line-height:1.3;
  padding-inline:16px;padding-block:20px 40px;-webkit-font-smoothing:none}
h1,h2,h3{font-family:var(--fd);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:22px;letter-spacing:.02em}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ember)}
p{margin:0}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{max-width:1080px;margin:0 auto 22px;display:flex;flex-direction:column;gap:6px}
.top p{color:var(--muted);max-width:62ch}
.stage{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start}
@media (max-width:800px){.stage{grid-template-columns:1fr}}

/* ---------- phone ---------- */
.phone-col{display:flex;flex-direction:column;gap:14px;align-items:center}
.phone-scale{width:360px;max-width:100%;position:relative}
.phone{width:360px;height:720px;position:relative;overflow:hidden;border-radius:30px;border:4px solid #262f44;
  background:#000;box-shadow:0 30px 60px -20px rgba(0,0,0,.8),inset 0 0 0 1px #0a0d14;transform-origin:top left;touch-action:none;user-select:none;-webkit-user-select:none}
#scene{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none}
.hud > *{pointer-events:auto}
.hud > .nop{pointer-events:none}

.plate{position:absolute;display:flex;flex-direction:column;gap:3px}
.plate .nm{font-family:var(--fd);font-size:9px;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 0 #000}
.bar{height:10px;background:rgba(0,0,0,.6);border:2px solid #0a0d14;box-shadow:0 0 0 1px #3a4966;position:relative}
.bar i{display:block;height:100%;transition:width .12s steps(4)}
.bar.hp i{background:var(--hp)} .bar.mp i{background:var(--mp)} .bar.cast i{background:var(--purple)}
.bar b{position:absolute;right:3px;top:-3px;font-size:13px;font-weight:400;color:#fff;text-shadow:0 1px 0 #000;font-variant-numeric:tabular-nums}
.plate-p{left:14px;top:14px;width:132px}
.plate-e{left:50%;transform:translateX(-50%);top:14px;width:150px;align-items:center}
.plate-e .nm{display:flex;align-items:center;gap:5px}
.plate-e .nm::before{content:"";width:8px;height:8px;border:2px solid var(--gold);transform:rotate(45deg);display:inline-block}
.plate-e .bar{width:100%}
.plate-e .cast{width:100%;display:none;flex-direction:column;gap:2px}
.plate-e .cast .lbl{font-size:12px;color:var(--purple);text-align:center;text-shadow:0 1px 0 #000}
.plate-e.casting .cast{display:flex}
.plate-e.none{opacity:.55}
.plate-e.none .bar,.plate-e.none .cast{display:none}
.plate-e.none .nm::before{display:none}
.chips{position:absolute;left:14px;top:66px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.chip{font-size:14px;padding:1px 6px;background:rgba(0,0,0,.55);border:1px solid var(--line2);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.buff{color:var(--gold);border-color:var(--gold)}
.chip.inv{color:var(--teal);border-color:var(--teal)}
.chip.rev{color:var(--ember);border-color:var(--ember)}
.btn-mount{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(235,229,212,.55);padding:0;
  background:radial-gradient(circle at 40% 35%,rgba(30,36,50,.3),rgba(10,14,22,.42));display:grid;place-items:center;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.btn-mount canvas{width:24px;height:24px;image-rendering:pixelated}
.btn-mount .t{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--fd);font-size:7px;letter-spacing:.06em;color:var(--ink);text-transform:uppercase;text-shadow:0 1px 0 #000}
.btn-mount .cdf{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(167,139,250,.5) var(--p,0%),transparent 0)}
.btn-mount.on{border-color:var(--gold);box-shadow:0 0 0 2px #0a0710,0 0 16px -2px var(--gold)}
.btn-mount.on .t{color:var(--gold)}
.fan .it.revit.active{background:rgba(242,193,78,.18)}
.btn-rot.rev{border-style:dashed}
.btn-rot .badge{display:none;position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1205;font-family:var(--fd);font-size:8px;letter-spacing:.08em;padding:2px 6px;border:2px solid #120806}
.btn-rot.rev .badge{display:block}
#revbtn{align-self:flex-start;padding:8px 12px;background:none;border:2px solid var(--line2);font-family:var(--fd);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#revbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(242,193,78,.12)}

.log{position:absolute;left:14px;bottom:176px;width:186px;display:flex;flex-direction:column;gap:1px;font-size:15px;line-height:1.1}
.log div{color:var(--muted);text-shadow:0 1px 0 #000,0 0 6px #000;opacity:.75}
.log div:last-child{color:var(--ink);opacity:1}
.log .c{color:var(--gold)} .log .h{color:var(--hp)} .log .t{color:var(--teal)}

.stick{position:absolute;left:34px;bottom:58px;width:96px;height:96px;border-radius:50%;border:2px dashed var(--line2);
  display:grid;place-items:center;color:var(--dim);font-family:var(--fd);font-size:8px;letter-spacing:.08em;transition:opacity .2s}
.stick .knob{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.25);position:absolute;left:29px;top:29px}
.stick.live{border-color:var(--teal);color:var(--teal)}
.stick.live .knob{background:rgba(61,219,217,.25);border-color:var(--teal)}

.cluster{position:absolute;right:26px;bottom:44px;width:150px;height:200px}
.btn-dec{position:absolute;right:8px;top:0;width:66px;height:66px;border-radius:50%;border:2px solid rgba(235,229,212,.55);
  background:radial-gradient(circle at 40% 35%,rgba(30,36,50,.3),rgba(10,14,22,.42));backdrop-filter:blur(1px);display:grid;place-items:center;padding:0;
  box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.btn-dec canvas{width:32px;height:32px;image-rendering:pixelated;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.btn-dec .badge{display:none}
.btn-dec .t{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--fd);font-size:8px;letter-spacing:.06em;color:var(--ink);text-transform:uppercase;text-shadow:0 1px 0 #000}
.btn-dec.cd{border-color:rgba(235,229,212,.3)}
.btn-dec .cdf{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.4) var(--p,0%),transparent 0)}
@keyframes pulse{50%{box-shadow:0 0 0 2px #071013,0 0 28px 2px var(--teal)}}

.rot-wrap{position:absolute;right:0;bottom:0;width:112px;height:112px}
.ring{position:absolute;inset:0;width:112px;height:112px;pointer-events:none}
.btn-rot{position:absolute;inset:11px;width:90px;height:90px;border-radius:50%;border:2px solid rgba(235,229,212,.55);padding:0;
  background:radial-gradient(circle at 40% 35%,rgba(30,36,50,.3),rgba(10,14,22,.42));backdrop-filter:blur(1px);display:grid;place-items:center;
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 5px 0 rgba(0,0,0,.45)}
.btn-rot.down{transform:translateY(4px);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 1px 0 rgba(0,0,0,.45)}
.btn-rot.err{border-color:var(--hp)}
.btn-rot canvas{width:48px;height:48px;image-rendering:pixelated;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.btn-rot .cdf{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.4) var(--p,0%),transparent 0)}
.btn-rot .nm{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--fd);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-shadow:0 1px 0 #000}
.queue{position:absolute;right:112px;bottom:14px;display:flex;flex-direction:row-reverse;gap:6px;align-items:flex-end}
.queue .q{width:30px;height:30px;border:2px solid var(--line2);background:rgba(0,0,0,.6);display:grid;place-items:center;opacity:.85}
.queue .q:nth-child(2){width:24px;height:24px;opacity:.6}
.queue canvas{width:18px;height:18px;image-rendering:pixelated}
.queue .q:nth-child(2) canvas{width:14px;height:14px}
.queue .lbl{position:absolute;right:0;top:-16px;font-family:var(--fd);font-size:7px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}

.fan{position:absolute;inset:0;display:none;pointer-events:none}
.fan.on{display:block}
.wheel{position:absolute;inset:0;display:none}
.wheel.on{display:block}
.wheel::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--wx,278px) var(--wy,576px),transparent 44px,rgba(4,6,10,.55) 230px)}
.wheel svg g.wg{animation:wopen .16s steps(4) both}
.wheel .wi.sm canvas{width:26px;height:26px}
.wheel .wi.sm span{font-size:6px}
@keyframes wopen{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
.wheel path.wedge{transition:transform .08s;fill:url(#wgrad);stroke:#7d879c;stroke-width:1.5}
.wheel path.wedge.hot{transform:scale(1.06);fill:rgba(235,229,212,.34)}
.wheel path.wedge.dis{fill:rgba(224,80,75,.22)}
.wheel path.wedge.dis.hot{fill:rgba(224,80,75,.45)}
.wheel .wname{position:absolute;left:0;right:110px;top:var(--ny,672px);text-align:center;font-family:var(--fd);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);text-shadow:0 2px 0 #000,0 0 8px #000;pointer-events:none}
.wheel .wname small{display:block;font-size:8px;color:var(--muted);letter-spacing:.06em}
.wheel svg{position:absolute;inset:0}
.wheel .wicons{position:absolute;inset:0}
.wheel .wi{position:absolute;width:44px;height:44px;margin:-22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none;transition:transform .08s}
.wheel .wi canvas{width:34px;height:34px;image-rendering:pixelated;filter:drop-shadow(0 2px 0 rgba(0,0,0,.7))}
.wheel .wi span{font-family:var(--fd);font-size:7px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);text-shadow:0 1px 0 #000,0 0 4px #000;white-space:nowrap}
.wheel .wi b{font-family:var(--fd);font-size:13px;color:#fff;text-shadow:0 2px 0 #000;position:absolute;inset:0;display:grid;place-items:center}
.wheel .wi.hot{transform:scale(1.3)}
.wheel .wi .cost{position:absolute;top:-8px;right:-10px;font-family:var(--fb);font-size:11px;background:var(--mp);color:#fff;padding:0 3px;line-height:1.1}
.wheel .wi.dis{opacity:.45}
.fan .it{position:absolute;width:52px;height:52px;margin:-26px;transform:translate(0,0);border-radius:50%;border:2px solid var(--line2);background:rgba(10,14,22,.45);
  display:grid;place-items:center;transition:transform .08s}
.fan .it canvas{width:26px;height:26px;image-rendering:pixelated;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.fan .it span{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--fd);font-size:7px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;text-shadow:0 1px 0 #000}
.fan .it.hot{border-color:var(--gold);transform:scale(1.18)}
.fan .it.hot span{color:var(--gold)}
.fan .it{animation:fanin .12s steps(3) backwards}
.fan .it.dis{background:rgba(224,80,75,.25)}
@keyframes fanin{from{transform:scale(.4)}}
.fan .it:nth-child(2){animation-delay:.02s}.fan .it:nth-child(3){animation-delay:.04s}.fan .it:nth-child(4){animation-delay:.06s}.fan .it:nth-child(5){animation-delay:.08s}
.cdt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:16px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;pointer-events:none;font-variant-numeric:tabular-nums}
.fan .it .cdt{font-size:12px}
.fan .it::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.7) var(--p,0%),transparent 0);pointer-events:none}
.fan .it .cost{position:absolute;top:-6px;right:-6px;left:auto;bottom:auto;transform:none;font-size:12px;background:var(--mp);color:#fff;padding:0 3px;line-height:1.1}

.banner{position:absolute;left:0;right:0;top:250px;text-align:center;font-family:var(--fd);font-size:22px;letter-spacing:.04em;
  color:var(--gold);text-shadow:0 3px 0 #000,0 0 18px var(--gold);opacity:0;transform:scale(.8);pointer-events:none}
.banner.show{animation:ban .9s steps(6) forwards}
@keyframes ban{0%{opacity:0;transform:scale(.8)}20%{opacity:1;transform:scale(1.05)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.banner.bad{color:var(--hp);text-shadow:0 3px 0 #000,0 0 18px var(--hp)}
.banner.cool{color:var(--teal);text-shadow:0 3px 0 #000,0 0 18px var(--teal)}

.floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;font-family:var(--fd);font-size:15px;color:#fff;text-shadow:0 2px 0 #000;animation:fl .9s steps(9) forwards}
.fl.crit{color:var(--gold);font-size:21px}.fl.heal{color:var(--ok)}.fl.hurt{color:var(--hp)}.fl.dot{color:#ff7a72;font-size:12px}.fl.aa{font-size:12px;color:#d3dcea}
.fl.name{font-size:11px;letter-spacing:.08em;animation-duration:.7s}
.btn-rot.cast,.btn-dec.cast{animation:castflash .3s steps(3) forwards}
@keyframes castflash{0%{box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 0 6px rgba(244,241,230,.8),0 0 24px 4px rgba(244,241,230,.6)}100%{box-shadow:0 0 0 1px rgba(0,0,0,.6),0 5px 0 rgba(0,0,0,.45)}}
@keyframes fl{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-54px);opacity:0}}

.dead{position:absolute;inset:0;background:rgba(80,0,0,.55);display:none;place-items:center;font-family:var(--fd);font-size:20px;color:var(--ink);text-shadow:0 3px 0 #000}
.dead.on{display:grid}

/* ---------- controls under phone ---------- */
.ctl{width:360px;max-width:100%;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;border:2px solid var(--line);background:var(--panel)}
.seg button{flex:1;padding:8px 4px;background:none;border:0;font-family:var(--fd);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ember);color:#1a0d05}
.seg.teal button[aria-pressed="true"]{background:var(--teal);color:#05201f}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:2px solid var(--line);padding:6px 8px}
.stat .k{font-family:var(--fd);font-size:7px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-size:26px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tog{padding:6px 10px;background:var(--panel);border:2px solid var(--line);font-family:var(--fd);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tog[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

/* ---------- side panel ---------- */
.side{background:var(--panel);border:2px solid var(--line);min-width:0}
.pane{padding:18px;display:flex;flex-direction:column;gap:18px}
.pane[hidden]{display:none}
.sect{display:flex;flex-direction:column;gap:8px}
.sect p{color:var(--muted);max-width:62ch}
.sect p b{color:var(--ink);font-weight:400}

.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{width:64px;height:78px;border:2px solid var(--line2);background:var(--panel2);display:flex;flex-direction:column;align-items:center;padding:6px 4px 4px;gap:4px;position:relative}
.slot canvas{width:32px;height:32px;image-rendering:pixelated}
.slot .n{font-size:14px;color:var(--ink);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot .i{position:absolute;left:3px;top:2px;font-family:var(--fd);font-size:7px;color:var(--dim)}
.slot.empty{border-style:dashed;justify-content:center;color:var(--dim);font-size:14px}
.slot.lock{border-style:dashed;justify-content:center;color:var(--dim);font-family:var(--fd);font-size:7px;letter-spacing:.06em;text-align:center;line-height:1.5}
.slot.fixed{border-color:var(--gold);border-style:dotted;opacity:.85;cursor:default;justify-content:center}
.slot.cur{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember)}
.slot.cur::after{content:"next";position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-family:var(--fd);font-size:7px;letter-spacing:.06em;text-transform:uppercase;color:var(--ember);white-space:nowrap}
.slots.seq{gap:22px;padding-top:14px;position:relative}
.slots.seq .slot+.slot::before{content:"→";position:absolute;left:-19px;top:28px;color:var(--dim);font-size:18px;line-height:1}
.slots.seq .slot.empty::before{display:none}
.slots.seq::after{content:"↺ loops";font-family:var(--fd);font-size:7px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);align-self:center}
.sect h3{margin-top:4px}
.sect h2 .sub{color:var(--dim);font-size:8px;letter-spacing:.06em;text-transform:none;margin-left:8px}
.slot,.tile{touch-action:none;cursor:grab}
.slot.over{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);background:rgba(242,193,78,.12)}
.slot.dragging{opacity:.35}
.ghost{position:fixed;z-index:50;pointer-events:none;width:48px;height:48px;border-radius:8px;border:2px solid var(--gold);background:rgba(10,14,22,.85);display:grid;place-items:center;transform:translate(-50%,-50%) scale(1.1)}
.ghost canvas{width:32px;height:32px;image-rendering:pixelated}
.slot .mv{position:absolute;bottom:2px;display:flex;gap:2px}
.slot .mv button,.slot .x{background:none;border:0;padding:0 3px;font-size:13px;color:var(--dim);line-height:1}
.slot .mv button:hover,.slot .x:hover{color:var(--ink)}
.slot .x{position:absolute;right:2px;top:1px}
.pool{display:flex;gap:8px;flex-wrap:wrap}
.tile{width:88px;border:2px solid var(--line);background:var(--panel2);padding:7px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.tile:hover{border-color:var(--ember)}
.tile canvas{width:28px;height:28px;image-rendering:pixelated}
.tile .n{font-size:15px;line-height:1;color:var(--ink)}
.tile .d{font-size:13px;line-height:1.1;color:var(--dim);font-variant-numeric:tabular-nums}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.presets button{padding:7px 12px;background:none;border:2px solid var(--line2);font-family:var(--fd);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.presets button:hover{border-color:var(--gold);color:var(--gold)}

.rules{display:flex;flex-direction:column;gap:8px}
.rule{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);background:var(--panel2);padding:8px 10px}
.rule .cond{color:var(--ink)}.rule .cond em{font-style:normal;color:var(--teal)}
.rule .act{display:flex;align-items:center;gap:6px;color:var(--gold);white-space:nowrap}
.rule .act canvas{width:18px;height:18px;image-rendering:pixelated}
.rule.lock{opacity:.5}.rule.lock .act{color:var(--dim)}
.sw{width:38px;height:20px;border:2px solid var(--line2);background:var(--panel);position:relative;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--dim);transition:left .1s steps(2)}
.sw[aria-checked="true"]{border-color:var(--teal)}.sw[aria-checked="true"]::after{left:20px;background:var(--teal)}

@media (prefers-reduced-motion:reduce){.btn-dec.urgent{animation:none;box-shadow:0 0 0 2px #071013,0 0 28px 2px var(--teal)}.fl{animation-duration:.4s}.fan .it{animation:none}}
</style>
</head>
<body>

<script>
(function(){
'use strict';
// ---------- pixel helpers ----------
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');}
const PAL={w:'#f4f1e6',k:'#161a24',g:'#f2c14e',r:'#e0504b',s:'#8fa3c1',b:'#6b4a2b'};
function drawIcon(cv,map,col){if(cv.width!==12){cv.width=12;cv.height=12;}const c=cv.getContext('2d');c.clearRect(0,0,12,12);const L=shade(col,55),D=shade(col,-55);
  for(let y=0;y<12;y++)for(let x=0;x<12;x++){const ch=map[y][x];if(ch==='.')continue;c.fillStyle=ch==='x'?col:ch==='l'?L:ch==='d'?D:PAL[ch];c.fillRect(x,y,1,1);}}
function mkIcon(map,col){const cv=document.createElement('canvas');cv.width=12;cv.height=12;drawIcon(cv,map,col);return cv;}
const IC={
 thrust:['...........w','..........wl','.........wld','........wld.','.......wld..','......wld...','.gg..wld....','..gg.ld.....','..gggg......','.bbggg......','bbb..gg.....','bb..........'],
 slash:['..xl......xl','...xl......x','....xl......','.....xl.....','xl....xl....','.xl....xl...','..xl....xl..','...xl....xl.','....xl....xl','.....xl....x','......xl....','.......xl...'],

 warcry:['........l...','......x..l..','....xxx...l.','..xxxxx.l.l.','xxxxxxx..l.l','xlxxxxx..l.l','xlxxxxx..l.l','xxxxxxx..l.l','..xxxxx.l.l.','....xxx...l.','......x..l..','........l...'],
 charge:['.......x....','.......xx...','.......xxx..','l..xxxxxxxx.','ll.xllllllxx','l..xxxxxxxxx','...xxxxxxxx.','l..xxxxxxx..','ll.....xxx..','l......xx...','.......x....','............'],

const CD={mortal:30,potion:40,interrupt:15,retreat:10};
const PRESETS={mobs:['charge','thrust','slash','whirlwind'],jefe:['charge','warcry','thrust','slash'],pvp:['charge','thrust','rend','slash']};
const KIND={

 shaman:{n:'Goblin Shaman',hp:200,atk:2,per:2.6,spd:58,range:40,aggro:150,cast:true,castRange:150,scale:2,spr:1,gold:18},

};
const SPAWNS=[['goblin',6,9],['goblin',22,20],['goblin',7,20],['shaman',24,12],['ogre',13,3],['goblin',20,29]];
const START=[14,30];

// ---------- sprites ----------
const KN={r:'#d94040',k:'#3b4a63',l:'#d3dcea',s:'#8fa3c1',f:'#e8b58f',e:'#1a1a1a',b:'#6b4a2b',w:'#f0f0e0',g:'#f2c14e'};
const KNIGHT=['.....rr.....','....rkkk....','...kkkkkk...','...kllllk...','...kfefek...','...kffffk...','....kkkk....','..gkkkkkkg..','.gkssssssgw.','.gkssssssgw.','..kssssskww.','...bb..bb...','...bb..bb...','...bb..bb...','..kkk..kkk..'];
const GB={g:'#5da35a',d:'#2f6b34',e:'#ffea70',p:'#1a1a1a',b:'#6b4a2b',k:'#22301f',w:'#f4f1e6'};
const GOBLIN=['.d........d.','.dg......gd.','..dggggggd..','..gggggggg..','..gepggpeg..','..gggggggg..','..ggwggwgg..','...gggggg...','..bbbbbbbb..','..ggb..bgg..','..gg....gg..','..kk....kk..'];
function sprite(map,pal,tint){const w=map[0].length,h=map.length,cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=map[y][x];if(ch==='.')continue;c.fillStyle=pal[ch];c.fillRect(x,y,1,1);}
  if(tint){c.globalCompositeOperation='source-atop';c.fillStyle=tint;c.fillRect(0,0,w,h);}return cv;}
const SPR_K=sprite(KNIGHT,KN),SPR_G=[sprite(GOBLIN,GB),sprite(GOBLIN,GB,'rgba(120,60,200,.45)'),sprite(GOBLIN,GB,'rgba(140,90,40,.55)')];
const HP={b:'#8a5a2b',l:'#a8743a',k:'#3a2414',m:'#2a1a0e',e:'#f4f1e6',s:'#b23a34',t:'#2a1a0e'};
const HORSE=['..............kmm...','.............kmbbk..','............kmbbbbk.','.......kkkkkkmbbbebk','..t...kbbbbbbbbbbkk.','.tt..kbbssbbbbbbk...','tt..kbbssbbbbbbk....','.t.kbbbbbbbbbbk.....','...kblbbbbbblk......','...kblkkbbbkbk......','...kbk..kbk.kbk.....','...kbk..kbk..kbk....','...kkk..kkk..kkk....'];
const SPR_H=sprite(HORSE,HP);

// ---------- map ----------
const T=32,COLS=28,ROWS=36,MW=COLS*T,MH=ROWS*T;
let seed=1337;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
const map=[];for(let r=0;r<ROWS;r++){map.push(new Array(COLS).fill(0));}
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(((c-20)/4.5)**2+((r-11)/3.2)**2<1)map[r][c]=2;}
for(let r=0;r<ROWS;r++){const cx=Math.round(12+4*Math.sin(r/5));for(let d=-1;d<=1;d++){if(map[r][cx+d]===0)map[r][cx+d]=1;}}
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  if(r===0||r===ROWS-1||c===0||c===COLS-1){map[r][c]=3;continue;}
  if(map[r][c]!==0)continue;const v=rnd();
  if(v<0.07)map[r][c]=3;else if(v<0.09)map[r][c]=4;else if(v<0.17)map[r][c]=5;
}
function clear(cc,rr,rad){for(let r=rr-rad;r<=rr+rad;r++)for(let c=cc-rad;c<=cc+rad;c++){if(r>0&&r<ROWS-1&&c>0&&c<COLS-1&&(map[r][c]===3||map[r][c]===4))map[r][c]=0;}}
clear(START[0],START[1],2);SPAWNS.forEach(s=>clear(s[1],s[2],2));
// castle: rows 1-5, cols 9-17. 6 wall, 7 tower, 8 gate, 9 courtyard floor
for(let r=1;r<=5;r++)for(let c=9;c<=17;c++){const edge=r===1||r===5||c===9||c===17;map[r][c]=edge?6:9;}
[[1,9],[1,17],[5,9],[5,17]].forEach(p=>map[p[0]][p[1]]=7);
map[5][13]=8;map[5][14]=8;
for(let r=6;r<=9;r++){map[r][13]=1;map[r][14]=1;}
clear(13,7,2);
const solid=t=>t===2||t===4||t===6||t===7;
function solidAt(x,y){const c=Math.floor(x/T),r=Math.floor(y/T);if(r<=0||c<=0||r>=ROWS-1||c>=COLS-1)return true;return solid(map[r][c]);}
function blocked(x,y,hw,hh){return solidAt(x-hw,y-hh)||solidAt(x+hw,y-hh)||solidAt(x-hw,y+hh)||solidAt(x+hw,y+hh);}

// tile art (16px, drawn at 32)
function tile(fn){const cv=document.createElement('canvas');cv.width=16;cv.height=16;const c=cv.getContext('2d');fn(c);return cv;}
function px(c,x,y,col,w,h){c.fillStyle=col;c.fillRect(x,y,w||1,h||1);}
const GRASS=[0,1,2].map(v=>tile(c=>{px(c,0,0,'#4f8f3e',16,16);for(let i=0;i<7;i++)px(c,Math.floor(rnd()*16),Math.floor(rnd()*16),'#457f36');for(let i=0;i<3;i++)px(c,Math.floor(rnd()*16),Math.floor(rnd()*16),'#5da34a');
  if(v===1){const x=4+Math.floor(rnd()*8),y=6+Math.floor(rnd()*6);px(c,x,y,'#6db856');px(c,x+1,y-1,'#6db856');px(c,x-1,y-1,'#6db856');}
  if(v===2){const x=Math.floor(rnd()*13),y=Math.floor(rnd()*13);px(c,x,y,'#457f36',3,1);px(c,x+1,y+1,'#457f36',1,2);}}));
const DIRT=[0,1].map(()=>tile(c=>{px(c,0,0,'#a5835a',16,16);for(let i=0;i<8;i++)px(c,Math.floor(rnd()*16),Math.floor(rnd()*16),'#8d6d47');for(let i=0;i<3;i++)px(c,Math.floor(rnd()*15),Math.floor(rnd()*16),'#b8956a',2,1);}));
const WATER=[0,1].map(f=>tile(c=>{px(c,0,0,'#3a7bc8',16,16);px(c,0,0,'#3572ba',16,1);for(let i=0;i<3;i++){const y=(2+i*5+f*2)%16,x=(i*6+f*3)%12;px(c,x,y,'#7db4ea',4,1);px(c,(x+8)%14,(y+2)%16,'#5b98db',2,1);}}));
const FLOWER=tile(c=>{c.drawImage(GRASS[0],0,0);const cols=['#e8534a','#f2c14e','#f4f1e6','#d68bf0'];for(let i=0;i<3;i++){const x=2+Math.floor(rnd()*11),y=2+Math.floor(rnd()*11);px(c,x,y+1,'#3f7a33');px(c,x,y,cols[i%4],2,1);px(c,x,y-1,cols[i%4],2,1);}});
const ROCK=tile(c=>{c.drawImage(GRASS[2],0,0);px(c,3,7,'#5f6570',10,7);px(c,4,5,'#8a8f99',8,8);px(c,5,4,'#8a8f99',5,2);px(c,5,5,'#b0b5bf',3,2);px(c,6,4,'#b0b5bf',2,1);px(c,4,12,'#4a4f58',9,1);px(c,9,9,'#6f757f',3,2);});
const TREE=(()=>{const cv=document.createElement('canvas');cv.width=16;cv.height=24;const c=cv.getContext('2d');
  px(c,6,12,'#5c3d23',4,12);px(c,7,12,'#7a5230',1,11);px(c,4,23,'#2a3d1f',8,1);
  const rows=[[5,6],[3,10],[2,12],[1,14],[1,14],[1,14],[1,14],[1,14],[1,14],[2,12],[3,10],[5,6]];rows.forEach((r,i)=>px(c,r[0],i,'#2f6b34',r[1],1));
  px(c,4,1,'#3f8a44',7,1);px(c,3,2,'#3f8a44',8,4);px(c,2,6,'#3f8a44',6,3);px(c,9,5,'#3f8a44',4,3);
  px(c,5,1,'#5aa85a',4,1);px(c,4,2,'#5aa85a',4,2);px(c,3,4,'#5aa85a',2,2);px(c,10,6,'#5aa85a',2,1);
  px(c,2,9,'#25562a',12,1);px(c,3,10,'#25562a',10,1);px(c,5,11,'#25562a',6,1);px(c,12,3,'#25562a',2,5);return cv;})();
const mapCv=document.createElement('canvas');mapCv.width=MW;mapCv.height=MH;const mc=mapCv.getContext('2d');mc.imageSmoothingEnabled=false;
// castle tiles
const WALL=tile(c=>{px(c,0,0,'#8b909c',16,16);for(let y=4;y<16;y+=4){px(c,0,y,'#5f6570',16,1);const off=(y/4)%2?4:0;for(let x=off;x<16;x+=8)px(c,x,y+1,'#5f6570',1,3);}
  px(c,0,0,'#4a4f58',16,4);for(let x=0;x<16;x+=4)px(c,x,0,'#a5aab5',2,3);px(c,0,3,'#b0b5bf',16,1);});
const FLOOR=[0,1].map(v=>tile(c=>{px(c,0,0,'#6f7886',16,16);px(c,0,7,'#586170',16,1);px(c,v?8:3,0,'#586170',1,8);px(c,v?4:11,8,'#586170',1,8);px(c,0,15,'#586170',16,1);for(let i=0;i<4;i++)px(c,Math.floor(rnd()*16),Math.floor(rnd()*16),'#7f8896',2,1);}));
const GATE=tile(c=>{c.drawImage(FLOOR[0],0,0);px(c,0,0,'#2a2f3a',16,6);px(c,0,6,'rgba(0,0,0,.35)',16,2);px(c,0,0,'#8b909c',2,6);px(c,14,0,'#8b909c',2,6);px(c,2,0,'#4a4f58',12,1);});
const TOWER=(()=>{const cv=document.createElement('canvas');cv.width=16;cv.height=24;const c=cv.getContext('2d');
  px(c,2,8,'#8b909c',12,16);px(c,2,8,'#5f6570',1,16);px(c,13,8,'#5f6570',1,16);px(c,4,12,'#5f6570',8,1);px(c,4,17,'#5f6570',8,1);px(c,7,13,'#161a24',2,3);
  const roof=[[7,2],[6,4],[5,6],[4,8],[3,10],[2,12],[1,14],[1,14]];roof.forEach((r,i)=>px(c,r[0],i,'#a3352f',r[1],1));
  px(c,1,7,'#6e2320',14,1);for(let i=1;i<7;i++)px(c,7-i+1,i,'#c2453d',2,1);px(c,3,2,'#f2c14e',1,1);px(c,3,1,'#e0504b',4,2);px(c,3,0,'#e0504b',3,1);px(c,3,0,'#5c3d23',1,4);return cv;})();
const waterTiles=[],treeTiles=[];
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=map[r][c],x=c*T,y=r*T;
  if(t===1)mc.drawImage(DIRT[(r+c)%2],x,y,T,T);else if(t===2){mc.drawImage(WATER[0],x,y,T,T);waterTiles.push([x,y]);}

}

  sc.font='18px Silkscreen, monospace';
  if(e.tele&&e.stunT<=0){sc.fillStyle='#000';sc.fillText('!',Q.x-5+1,y-19+1);sc.fillStyle='#f2c14e';sc.fillText('!',Q.x-5,y-19);}
  if(e.stunT>0){sc.fillStyle='#93a0b8';sc.font='9px Silkscreen, monospace';sc.fillText('zzz',Q.x-9,y-14);}
  if(e.aggro&&!e.tele&&e.castT<=0&&e.stunT<=0){sc.fillStyle='#e0504b';sc.fillRect(Q.x-2,y-15,4,4);}
  if(S.target===e){const p=Math.sin(now/180)*2,m=5+p,bx=x-4-p,by=y-4-p,bw=w+8+2*p,bh=h+8+2*p;
    sc.strokeStyle='#000';sc.lineWidth=4;bracket(bx,by,bw,bh,m);sc.strokeStyle='#f2c14e';sc.lineWidth=2;bracket(bx,by,bw,bh,m);
    sc.fillStyle='#f2c14e';sc.beginPath();sc.moveTo(Q.x-5,by-12);sc.lineTo(Q.x+5,by-12);sc.lineTo(Q.x,by-5);sc.closePath();sc.fill();}
}
function bracket(x,y,w,h,m){sc.beginPath();sc.moveTo(x,y+m);sc.lineTo(x,y);sc.lineTo(x+m,y);sc.moveTo(x+w-m,y);sc.lineTo(x+w,y);sc.lineTo(x+w,y+m);sc.moveTo(x+w,y+h-m);sc.lineTo(x+w,y+h);sc.lineTo(x+w-m,y+h);sc.moveTo(x+m,y+h);sc.lineTo(x,y+h);sc.lineTo(x,y+h-m);sc.stroke();}
function shadow(x,y,w){sc.fillStyle='rgba(0,0,0,.3)';if(S.iso){sc.beginPath();sc.ellipse(x,y,w/2+4,(w/2+4)/2,0,0,Math.PI*2);sc.fill();}else sc.fillRect(x-w/2,y-2,w,5);}
function drawPlayer(){const w=24,h=30,Q=pos(S.x,S.y),x=Q.x-w/2,y=Q.y-h+8;
  const moving=S.mv.x||S.mv.y||[...keys].some(k=>'wasdarrowleftarrowrightarrowuparrowdown'.includes(k));
  if(S.mounted){const bob=moving?Math.round(Math.abs(Math.sin(performance.now()/70))*3):0;
    shadow(Q.x,Q.y+5,32);
    sc.save();if(S.invT>0)sc.globalAlpha=.5;sc.translate(Q.x,0);sc.scale(S.face,1);
    sc.drawImage(SPR_H,-24,Q.y-27-bob,48,31);sc.drawImage(SPR_K,0,0,12,10,-11,Q.y-43-bob,24,20);sc.restore();
    if(S.buffT>0){sc.fillStyle='#f2c14e';sc.font='9px Silkscreen, monospace';sc.fillText('▲',Q.x+18,y-6);}return;}
  shadow(Q.x,Q.y+5,w-6);
  const bob=moving?Math.round(Math.abs(Math.sin(performance.now()/90))*2):0;
  sc.save();if(S.invT>0)sc.globalAlpha=.5;sc.translate(Q.x,0);sc.scale(S.face,1);sc.drawImage(SPR_K,-w/2,y-bob,w,h);sc.restore();
  if(S.mountT>0){sc.fillStyle='#0a0d14';sc.fillRect(Q.x-16,y-12,32,6);sc.fillStyle='#a78bfa';sc.fillRect(Q.x-15,y-11,Math.round(30*(1-S.mountT)),4);}
  if(S.buffT>0){sc.fillStyle='#f2c14e';sc.font='9px Silkscreen, monospace';sc.fillText('▲',Q.x+14,y+4);}
}

// ---------- input: map (joystick + target) ----------
const phone=$('phone');
function phonePoint(ev){const r=phone.getBoundingClientRect();const k=r.width/360;return{x:(ev.clientX-r.left)/k,y:(ev.clientY-r.top)/k};}
let joy=null,lastTapT=0,lastTapP={x:0,y:0};
const scene=$('scene');
scene.addEventListener('pointerdown',ev=>{ev.preventDefault();const p=phonePoint(ev);
  let hit=null,bd=30;S.enemies.forEach(e=>{if(!e.alive)return;const sp=toScreen(e.x,e.y);const d=Math.hypot(sp.x-p.x,sp.y-6*e.def.scale-p.y);if(d<bd+6*e.def.scale){bd=d;hit=e;}});
  if(hit){if(S.target!==hit)S.seqI=0;S.target=hit;log('Target: '+hit.n+'.','');return;}
  const nowT=performance.now();if(nowT-lastTapT<280&&Math.hypot(p.x-lastTapP.x,p.y-lastTapP.y)<40){const m=S.lastMove||{x:S.face,y:0};dodge(m.x,m.y);lastTapT=0;return;}
  lastTapT=nowT;lastTapP=p;
  scene.setPointerCapture(ev.pointerId);joy={id:ev.pointerId,x:p.x,y:p.y};
  el.stick.classList.add('live');el.stick.style.left=(p.x-48)+'px';el.stick.style.top=(p.y-48)+'px';el.stick.style.bottom='auto';el.knob.style.left='29px';el.knob.style.top='29px';});
scene.addEventListener('pointermove',ev=>{if(!joy||ev.pointerId!==joy.id)return;const p=phonePoint(ev);let dx=p.x-joy.x,dy=p.y-joy.y;const l=Math.hypot(dx,dy);if(l>40){dx=dx/l*40;dy=dy/l*40;}
  S.mv={x:dx/40,y:dy/40};if(l<8)S.mv={x:0,y:0};el.knob.style.left=(29+dx)+'px';el.knob.style.top=(29+dy)+'px';});
function joyEnd(ev){if(!joy||ev.pointerId!==joy.id)return;joy=null;S.mv={x:0,y:0};el.stick.classList.remove('live');el.stick.style.left='34px';el.stick.style.top='auto';el.stick.style.bottom='58px';el.knob.style.left='29px';el.knob.style.top='29px';}
scene.addEventListener('pointerup',joyEnd);scene.addEventListener('pointercancel',joyEnd);

// ---------- input: two buttons, each with tap + hold wheel ----------
let hot=null,openBtn=0,WC=null;
const CX=360-26-56,CY=720-44-100,DCX=360-26-8-33,DCY=720-44-200+33;
const BTN={1:{el:()=>el.decB,cx:DCX,cy:DCY,a0:165,a1:310,r0:44,r1:100,nameY:384,list:()=>S.w1,hasRev:false,sel:()=>S.sel1,setSel:k=>S.sel1=k},
           2:{el:()=>el.spell,cx:CX,cy:CY,a0:122,a1:262,r0:60,r1:142,nameY:672,list:()=>S.w2,hasRev:true,sel:()=>S.sel2,setSel:k=>S.sel2=k}};
function wheelItems(c){const it=c.list().map(k=>({k,n:info(k).n,col:info(k).col}));if(c.hasRev)it.push({k:'rev',n:S.rev?'Rev · stop':'Rev',col:'#f2c14e'});return it;}
function arcPath(c,a0,a1,r0,r1){const d=Math.PI/180,x=(a,r)=>c.cx+r*Math.cos(a*d),y=(a,r)=>c.cy+r*Math.sin(a*d);return `M${x(a0,r0)} ${y(a0,r0)} L${x(a0,r1)} ${y(a0,r1)} A${r1} ${r1} 0 0 1 ${x(a1,r1)} ${y(a1,r1)} L${x(a1,r0)} ${y(a1,r0)} A${r0} ${r0} 0 0 0 ${x(a0,r0)} ${y(a0,r0)} Z`;}
function itemPos(c,i,n){const step=(c.a1-c.a0)/n,am=c.a0+(i+.5)*step,rm=(c.r0+c.r1)/2+4;return[c.cx+rm*Math.cos(am*Math.PI/180),c.cy+rm*Math.sin(am*Math.PI/180)];}
function buildWheel(c){const items=wheelItems(c),n=items.length,step=(c.a1-c.a0)/n,svg=el.wheel.querySelector('svg'),ic=el.wheel.querySelector('.wicons');ic.innerHTML='';
  let out=`<defs><radialGradient id="wgrad" gradientUnits="userSpaceOnUse" cx="${c.cx}" cy="${c.cy}" r="${c.r1}"><stop offset=".42" stop-color="#06090f" stop-opacity=".92"/><stop offset="1" stop-color="#101827" stop-opacity=".6"/></radialGradient><filter id="wglow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g class="wg" style="transform-origin:${c.cx}px ${c.cy}px">`;
  items.forEach((it,i)=>{const a0=c.a0+i*step,a1=a0+step-2;const [px_,py_]=itemPos(c,i,n);
    out+=`<path class="wedge" data-k="${it.k}" data-a0="${a0}" data-a1="${a1}" data-col="${it.col}" style="transform-origin:${c.cx}px ${c.cy}px" d="${arcPath(c,a0,a1,c.r0,c.r1)}"/><path class="wcd" data-k="${it.k}" d="" fill="rgba(0,0,0,.62)"/>`;
    const d=document.createElement('div');d.className='wi'+(it.k==='rev'&&S.rev?' hot':'')+(c.r1<120?' sm':'');d.dataset.k=it.k;d.style.left=px_+'px';d.style.top=py_+'px';d.appendChild(mkIcon(IC[it.k],it.col));const sp=document.createElement('span');sp.textContent=it.n;d.appendChild(sp);
    const b=document.createElement('b');b.className='cdt';d.appendChild(b);ic.appendChild(d);});
  out+=`<circle cx="${c.cx}" cy="${c.cy}" r="${c.r0-4}" fill="none" stroke="#f4f1e6" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="3 4"/><line id="wptr" x1="${c.cx}" y1="${c.cy}" x2="${c.cx}" y2="${c.cy}" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/><circle cx="${c.cx}" cy="${c.cy}" r="5" fill="#fff"/></g>`;
  svg.innerHTML=out;el.wheel.style.setProperty('--wx',c.cx+'px');el.wheel.style.setProperty('--wy',c.cy+'px');const wn=$('wname');wn.style.top=c.nameY+'px';wn.innerHTML='<small>hold and aim</small>';}
function wheelPick(c,ev){const p=phonePoint(ev);const dx=p.x-c.cx,dy=p.y-c.cy,d=Math.hypot(dx,dy);let a=Math.atan2(dy,dx)*180/Math.PI;if(a<0)a+=360;const ptr=el.wheel.querySelector('#wptr');if(ptr){const L=Math.min(d,c.r0-6);ptr.setAttribute('x2',c.cx+L*Math.cos(a*Math.PI/180));ptr.setAttribute('y2',c.cy+L*Math.sin(a*Math.PI/180));}
  if(d<22)return null;const items=wheelItems(c),n=items.length,step=(c.a1-c.a0)/n;if(a<c.a0-8||a>c.a1+8)return null;const i=Math.max(0,Math.min(n-1,Math.floor((a-c.a0)/step)));return items[i].k;}
function hlWheel(){el.wheel.querySelectorAll('path.wedge').forEach(pth=>{pth.classList.toggle('hot',pth.dataset.k===hot);});el.wheel.querySelectorAll('.wi').forEach(n=>n.classList.toggle('hot',n.dataset.k===hot||(n.dataset.k==='rev'&&S.rev&&!hot)));
  const wn=$('wname');if(!hot)wn.innerHTML='<small>hold and aim</small>';else if(hot==='rev')wn.innerHTML=(S.rev?'Turn Rev off':'Turn Rev on')+'<small>each tap, the next step</small>';else{const inf=info(hot);const why=canDo(hot);wn.innerHTML=inf.n+'<small>'+(why?why.replace(inf.n+': ','').replace(inf.n+' ',''):inf.desc)+'</small>';}}
let press=null,pressTimer=null;
function bindButton(b){const c=BTN[b],btn=c.el();
  btn.addEventListener('pointerdown',ev=>{ev.preventDefault();if(press)return;btn.setPointerCapture(ev.pointerId);press={b,id:ev.pointerId};
    pressTimer=setTimeout(()=>{if(press&&press.b===b){openBtn=b;WC=c;hot=null;buildWheel(c);el.wheel.classList.add('on');}},140);});
  btn.addEventListener('pointermove',ev=>{if(!press||press.b!==b||openBtn!==b)return;hot=wheelPick(c,ev);hlWheel();});
  const end=()=>{if(!press||press.b!==b)return;clearTimeout(pressTimer);
    if(openBtn===b){if(hot==='rev')setRev(!S.rev);else if(hot){if(b===2&&S.rev){S.rev=false;log('Rev off: you picked '+info(hot).n+' by hand.','');}c.setSel(hot);if(!doAction(hot,true,btn))log(info(hot).n+' selected. Tap to cast when you can.','');}
      openBtn=0;WC=null;el.wheel.classList.remove('on');}
    else tapBtn(b);
    press=null;};
  btn.addEventListener('pointerup',end);btn.addEventListener('pointercancel',end);btn.addEventListener('contextmenu',e=>e.preventDefault());}
bindButton(1);bindButton(2);
el.mount.addEventListener('click',mountToggle);drawIcon(el.mount.querySelector('canvas'),IC.mount,'#a78bfa');
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','arrowleft','arrowright','arrowup','arrowdown'].includes(k)){keys.add(k);if(e.target===document.body)e.preventDefault();}
  if(e.target.tagName==='INPUT')return;
  if(k==='m')mountToggle();if(k==='r')setRev(!S.rev);
  if(k===' '){e.preventDefault();tapBtn(2);}
  if(k==='e')tapBtn(1);if(k==='tab'){e.preventDefault();const t=nearestEnemy(S.target);if(t){S.target=t;S.seqI=0;log('Target: '+t.n+'.','');}}
  if(k==='shift'){const m=S.lastMove||{x:S.face,y:0};dodge(m.x,m.y);}
  if('12345'.includes(k)&&k!==''){const key=S.w2[+k-1];if(key){if(S.rev){S.rev=false;log('Rev off: you picked '+info(key).n+' by hand.','');}S.sel2=key;doAction(key,true,el.spell);}}});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));

// ---------- editors (drag & drop) ----------
const LISTS={w1:{arr:()=>S.w1,max:6,unique:true},w2:{arr:()=>S.w2,max:5,unique:true},seq:{arr:()=>S.seq,max:6,unique:false,skillsOnly:true}};
function renderList(container,name){
  const L=LISTS[name],arr=L.arr();container.innerHTML='';
  for(let i=0;i<L.max;i++){const d=document.createElement('div');d.dataset.list=name;d.dataset.idx=i;
    const k=arr[i];
    if(!k){d.className='slot empty';d.textContent='empty';container.appendChild(d);continue;}
    d.className='slot'+(name==='seq'&&S.seq.length>0&&i===revIdx()?' cur':'');d.dataset.key=k;
    const idx=document.createElement('span');idx.className='i';idx.textContent=i+1;d.appendChild(idx);
    const x=document.createElement('button');x.className='x';x.textContent='×';x.title='Remove';x.addEventListener('pointerdown',e=>e.stopPropagation());x.addEventListener('click',()=>{arr.splice(i,1);S.seqI=0;fixLast();renderSlots();});d.appendChild(x);
    d.appendChild(mkIcon(IC[k],info(k).col));const n=document.createElement('span');n.className='n';n.textContent=info(k).n;d.appendChild(n);
    d.addEventListener('pointerdown',ev=>startDrag(ev,{key:k,from:name,idx:i}));
    container.appendChild(d);}
  if(name==='w2'){const r=document.createElement('div');r.className='slot fixed';r.appendChild(mkIcon(IC.rev,'#f2c14e'));const n=document.createElement('span');n.className='n';n.textContent='Rev';r.appendChild(n);container.appendChild(r);}
}
function fixLast(){if(!S.w2.includes(S.sel2)&&S.w2.length)S.sel2=S.w2[0];if(!S.w1.includes(S.sel1)&&S.w1.length)S.sel1=S.w1[0];}
function renderSlots(){renderList($('slotsA'),'seq');renderList($('slots1'),'w1');renderList($('slots2'),'w2');}
function mkTile(k,container){const b=document.createElement('div');b.className='tile';const inf=info(k);b.appendChild(mkIcon(IC[k],inf.col));
  const n=document.createElement('span');n.className='n';n.textContent=inf.n;const d=document.createElement('span');d.className='d';d.textContent=inf.desc;b.appendChild(n);b.appendChild(d);
  b.addEventListener('pointerdown',ev=>startDrag(ev,{key:k,from:'pool',idx:-1}));container.appendChild(b);}
Object.keys(SK).forEach(k=>mkTile(k,$('poolSk')));Object.keys(ACT).forEach(k=>mkTile(k,$('poolOt')));
let drag=null,ghost=null,overEl=null;
function startDrag(ev,payload){ev.preventDefault();drag=payload;ghost=document.createElement('div');ghost.className='ghost';ghost.appendChild(mkIcon(IC[payload.key],info(payload.key).col));document.body.appendChild(ghost);moveGhost(ev);
  if(payload.from!=='pool')ev.currentTarget.classList.add('dragging');}
function moveGhost(ev){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';}
function slotAt(x,y){const e=document.elementFromPoint(x,y);return e?e.closest('.slot[data-list]'):null;}
window.addEventListener('pointermove',ev=>{if(!drag)return;moveGhost(ev);const sl=slotAt(ev.clientX,ev.clientY);if(sl!==overEl){if(overEl)overEl.classList.remove('over');overEl=sl;if(overEl)overEl.classList.add('over');}});
window.addEventListener('pointerup',ev=>{if(!drag)return;const sl=slotAt(ev.clientX,ev.clientY);
  if(sl)drop(drag,sl.dataset.list,+sl.dataset.idx);else if(drag.from!=='pool'){LISTS[drag.from].arr().splice(drag.idx,1);log(info(drag.key).n+' removed.','');}
  ghost.remove();ghost=null;drag=null;if(overEl){overEl.classList.remove('over');overEl=null;}S.seqI=0;fixLast();renderSlots();});
function drop(pl,list,idx){const L=LISTS[list],arr=L.arr();
  if(pl.from===list){if(pl.idx===idx)return;const [k]=arr.splice(pl.idx,1);arr.splice(Math.min(idx,arr.length),0,k);return;}
  if(L.skillsOnly&&!SK[pl.key]){log('The Rev sequence only takes skills.','h');return;}
  if(L.unique&&arr.includes(pl.key)){log(info(pl.key).n+' is already in that wheel.','');return;}
  if(pl.from!=='pool')LISTS[pl.from].arr().splice(pl.idx,1);
  if(idx<arr.length)arr.splice(idx,0,pl.key);else arr.push(pl.key);
  if(arr.length>L.max)arr.length=L.max;}
document.querySelectorAll('#presetsA [data-preset]').forEach(b=>b.addEventListener('click',()=>{S.seq=PRESETS[b.dataset.preset].slice();S.seqI=0;renderSlots();log('Preset '+b.textContent+' loaded.','');}));

$('revbtn').addEventListener('click',()=>setRev(!S.rev));
$('revauto').addEventListener('click',e=>{S.revAuto=!S.revAuto;e.currentTarget.setAttribute('aria-pressed',String(S.revAuto));log(S.revAuto?'Rev auto: fires on its own every GCD.':'Rev manual: each tap fires the marked step.','');});
$('tiso').addEventListener('click',e=>{S.iso=!S.iso;e.currentTarget.setAttribute('aria-pressed',String(S.iso));if(S.iso)ensureIso();log(S.iso?'Isometric view.':'Top-down view.','');});
$('tring').addEventListener('click',e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(on));S.showRing=on;el.clusterB.querySelector('.ring').style.visibility=on?'visible':'hidden';});
$('treset').addEventListener('click',()=>{reset();el.dead.classList.remove('on');openBtn=0;WC=null;el.wheel.classList.remove('on');});
function fit(){const w=Math.min(360,$('pscale').getBoundingClientRect().width);const s=w/360;phone.style.transform='scale('+s+')';$('pscale').style.height=(720*s)+'px';}
window.addEventListener('resize',fit);

reset();fit();ensureIso();el.clusterB.querySelector('.ring').style.visibility='hidden';requestAnimationFrame(tick);
})();
</script>
